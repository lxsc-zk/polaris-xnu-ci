name: unixnu-kernel

# Builds the UniXNU source kernel (XNU 10063 / Darwin 23) for polaris on a
# macOS runner that ships Xcode 26.6 by default, then hands the kernel.macho
# back as an artifact. Everything else (fetch/tree/package/payload/bootimg)
# runs locally in WSL.
#
# v2: adds an instrumented bootstrap pass (`bash -x`) so the first failure is
# reported with its exact command and exit status instead of a bare rc=1.

on:
  push:
    branches: [unixnu-kernel]
  workflow_dispatch:

env:
  UNIXNU_COMMIT: 37987aea410691df3c1e0e146a1bfd6127932149
  POLARIS_COMMIT: 3704a6b475154aa27628d2585d34e131e9a09ecc

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - name: Report toolchain
        run: |
          set -x
          uname -a
          sw_vers
          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-version || true
          python3 --version
          cmake --version | head -1 || echo 'cmake MISSING'
          for t in ninja unifdef ditto lipo; do printf '%s: ' "$t"; command -v "$t" || echo MISSING; done
          ls /opt/homebrew/opt/llvm/bin 2>/dev/null | head -5 || true
          ls /opt/homebrew/opt/lld/bin 2>/dev/null | head -5 || true

      - name: Fetch UniXNU and the polaris device repository
        run: |
          set -eux
          git clone --filter=blob:none https://github.com/UniXNU/UniXNU.git
          git -C UniXNU checkout "$UNIXNU_COMMIT"
          git clone --filter=blob:none https://github.com/SPRMD/UniXNU-polaris.git polaris
          git -C polaris checkout "$POLARIS_COMMIT"

      - name: defconfig / fetch / tree
        run: |
          set -eux
          cd UniXNU
          ./unixnu defconfig polaris_defconfig -D ../polaris
          ./unixnu fetch -D ../polaris
          ./unixnu tree -D ../polaris

      - name: Instrumented bootstrap pass (diagnostic)
        continue-on-error: true
        run: |
          set -x
          cd UniXNU/out/polaris/tree
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:$PATH"
          export JOBS=8 XNU_BOOT_PROGRESS=0
          set +e
          bash -x scripts/build-xnu-4k-baseline.sh > /tmp/bootstrap-x.log 2>&1
          rc=$?
          echo "BOOTSTRAP_RC=$rc"
          echo '--- last 120 lines of bash -x ---'
          tail -120 /tmp/bootstrap-x.log
          echo '--- first failing command (heuristic) ---'
          grep -n '^+' /tmp/bootstrap-x.log | tail -15
          exit 0

      - name: Build kernel
        run: |
          set -eux
          cd UniXNU
          ./unixnu build kernel -D ../polaris -j 8

      - name: Collect outputs
        if: always()
        run: |
          set -x
          find UniXNU/out/polaris -maxdepth 3 -type f \( -name '*.macho' -o -name '*.json' -o -name '*.log' \) -print | head -40

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-kernel
          path: |
            UniXNU/out/polaris/kernel/**
            UniXNU/out/polaris/logs/**
            /tmp/bootstrap-x.log
          if-no-files-found: warn
