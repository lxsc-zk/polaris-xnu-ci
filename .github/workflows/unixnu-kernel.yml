name: unixnu-kernel

# Builds the UniXNU source kernel (XNU 10063 / Darwin 23) for polaris on a
# macOS runner that ships Xcode 26.6 by default, then hands kernel.macho back
# as an artifact. Everything else (fetch/tree/package/payload/bootimg) runs
# locally in WSL.
#
# v3: the device repository carries a guarded copy of
# patches/xnu/offline-component-load-probes.patch in kernel-overrides/, which
# the driver does not pick up; without it bsd_init references
# _native_legacy_display_probe and the link fails when that feature is off
# (run 41817204383: "Undefined symbols ... _native_legacy_display_probe").
# So we lay the device's guarded patch over the base patch directory and pass
# it with --local-patches.

on:
  push:
    branches: [unixnu-kernel]
  workflow_dispatch:

env:
  UNIXNU_COMMIT: 37987aea410691df3c1e0e146a1bfd6127932149
  POLARIS_COMMIT: 3704a6b475154aa27628d2585d34e131e9a09ecc

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - name: Report toolchain
        run: |
          set -x
          xcodebuild -version
          xcode-select -p
          python3 --version
          cmake --version | head -1
          for t in ninja unifdef ditto lipo git make; do printf '%s: ' "$t"; command -v "$t" || echo MISSING; done

      - name: Fetch UniXNU and the polaris device repository
        run: |
          set -eux
          git clone --filter=blob:none https://github.com/UniXNU/UniXNU.git
          git -C UniXNU checkout "$UNIXNU_COMMIT"
          git clone --filter=blob:none https://github.com/SPRMD/UniXNU-polaris.git polaris
          git -C polaris checkout "$POLARIS_COMMIT"

      - name: defconfig / fetch / tree
        run: |
          set -eux
          cd UniXNU
          ./unixnu defconfig polaris_defconfig -D ../polaris
          ./unixnu fetch -D ../polaris
          ./unixnu tree -D ../polaris

      - name: Overlay the device's guarded XNU patch
        run: |
          set -eux
          mkdir -p local/patches
          cp -a UniXNU/patches/. local/patches/
          cp polaris/kernel-overrides/xnu/offline-component-load-probes.patch \
             local/patches/xnu/offline-component-load-probes.patch
          grep -c 'XNU_NATIVE_LEGACY_DISPLAY' local/patches/xnu/offline-component-load-probes.patch

      - name: Build kernel
        run: |
          set -eux
          cd UniXNU
          ./unixnu build kernel -D ../polaris --local-patches ../local/patches -j 8

      - name: Collect outputs
        if: always()
        run: |
          set -x
          find UniXNU/out/polaris -maxdepth 3 -type f \( -name '*.macho' -o -name '*.json' -o -name '*.log' \) -print | head -40
          tail -60 UniXNU/out/polaris/logs/kernel.log 2>/dev/null || true

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-kernel
          path: |
            UniXNU/out/polaris/kernel/**
            UniXNU/out/polaris/logs/**
          if-no-files-found: warn
