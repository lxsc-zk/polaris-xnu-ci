name: unixnu-kernel

# Builds the UniXNU source kernel (XNU 10063 / Darwin 23) for polaris on
# macos-26 (Xcode 26.6 by default) and hands kernel.macho back as an artifact.
#
# v5 fixes, in order of discovery:
#  1. bsd_init referenced _native_legacy_display_probe when the legacy display
#     feature is off -> the device repository's guarded copy of
#     patches/xnu/offline-component-load-probes.patch (in kernel-overrides/,
#     which the driver does not read) is laid over --local-patches.
#  2. scripts/prepare-xnu-source.py fetches api.github.com anonymously and died
#     with "HTTP Error 403: rate limit exceeded" on the shared runner IP ->
#     the script is taught to send GITHUB_TOKEN, and the step gets the token.

on:
  push:
    branches: [unixnu-kernel]
  workflow_dispatch:

env:
  UNIXNU_COMMIT: 37987aea410691df3c1e0e146a1bfd6127932149
  POLARIS_COMMIT: 3704a6b475154aa27628d2585d34e131e9a09ecc

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - name: Report toolchain
        run: |
          set -x
          xcodebuild -version
          python3 --version
          for t in cmake ninja unifdef ditto lipo git make; do printf '%s: ' "$t"; command -v "$t" || echo MISSING; done

      - name: Fetch UniXNU and the polaris device repository
        run: |
          set -eux
          git clone --filter=blob:none https://github.com/UniXNU/UniXNU.git
          git -C UniXNU checkout "$UNIXNU_COMMIT"
          git clone --filter=blob:none https://github.com/SPRMD/UniXNU-polaris.git polaris
          git -C polaris checkout "$POLARIS_COMMIT"

      - name: defconfig / fetch / tree
        run: |
          set -eux
          cd UniXNU
          ./unixnu defconfig polaris_defconfig -D ../polaris
          ./unixnu fetch -D ../polaris
          ./unixnu tree -D ../polaris

      - name: Overlay guarded XNU patch and authenticate GitHub API calls
        run: |
          set -eux
          mkdir -p local/patches
          cp -a UniXNU/patches/. local/patches/
          cp polaris/kernel-overrides/xnu/offline-component-load-probes.patch \
             local/patches/xnu/offline-component-load-probes.patch
          grep -c 'XNU_NATIVE_LEGACY_DISPLAY' local/patches/xnu/offline-component-load-probes.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('UniXNU/scripts/prepare-xnu-source.py')
          s = p.read_text()
          anchor = "import urllib.request\n"
          assert anchor in s, 'prepare-xnu-source.py: anchor not found'
          extra = [
              '',
              "_token = os.environ.get('GITHUB_TOKEN')",
              'if _token:',
              '    _opener = urllib.request.build_opener()',
              "    _opener.addheaders = [('Authorization', 'Bearer ' + _token),",
              "                          ('User-Agent', 'unixnu-ci'),",
              "                          ('Accept', 'application/vnd.github+json')]",
              '    urllib.request.install_opener(_opener)',
              '',
          ]
          p.write_text(s.replace(anchor, anchor + '\n'.join(extra), 1))
          print('patched', p)
          PY
          grep -n 'GITHUB_TOKEN' UniXNU/scripts/prepare-xnu-source.py
          python3 - <<'PY2'
          from pathlib import Path
          p = Path('UniXNU/scripts/unixnu/kernel.py')
          s = p.read_text()
          old = 'run([\u0027bash\u0027, script]'
          new = 'run([\u0027bash\u0027, \u0027-x\u0027, script]'
          assert old in s, 'kernel.py: anchor not found'
          p.write_text(s.replace(old, new))
          print('kernel.py now traces the build script under bash -x')
          PY2
          grep -n 'bash.*-x.*script' UniXNU/scripts/unixnu/kernel.py

      - name: Pre-build corecrypto archives
        # The XNU build script's bootstrap pass ends with a bare
        #   test -f build/corecrypto-2023/libcorecrypto_kernel_noasm-namespaced.a
        # so under `set -e` it exits 1 (silently) unless that archive already
        # exists. The driver only builds archives *after* the bootstrap pass,
        # so build them here first (run 41819002275's trace ends exactly there).
        run: |
          set -eux
          cd UniXNU/out/polaris/tree
          FEEDBASE=$(cd ../../../feeds && pwd)
          FEED=$(ls -d "$FEEDBASE"/corecrypto-2023-* | head -1)
          ln -sfn "$FEED" refer/corecrypto-2023
          ls -l refer/corecrypto-2023
          python3 scripts/build-corecrypto-14.py
          python3 scripts/build-corecrypto-14.py --namespace
          ls -l build/corecrypto-2023/*.a | head

      - name: Build kernel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eux
          cd UniXNU
          ./unixnu build kernel -D ../polaris --local-patches ../local/patches -j 8

      - name: Collect outputs
        if: always()
        run: |
          set -x
          find UniXNU/out/polaris -maxdepth 3 -type f \( -name '*.macho' -o -name '*.json' -o -name '*.log' \) -print | head -40

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-kernel
          path: |
            UniXNU/out/polaris/kernel/**
            UniXNU/out/polaris/logs/**
          if-no-files-found: warn
