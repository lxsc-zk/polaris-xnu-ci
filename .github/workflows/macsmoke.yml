name: macsmoke
on:
  workflow_dispatch:
jobs:
  which:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: list xcodes
        run: |
          echo "--- /Applications ---"
          ls -1 /Applications | grep -i '^Xcode' || true
          echo "--- xcode-select ---"
          xcode-select -p
          echo "--- iig present? ---"
          find /Applications -name iig -maxdepth 6 2>/dev/null | head -5